<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mahjong Infini</title>
<meta name="description" content="Mahjong solitaire pour mobile : plateaux générés à l'infini, pouvoirs d'aide et thème Neon City 2077.">
<meta name="theme-color" content="#0d0620">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahjong Infini">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-classic">

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <strong>Mahjong <em>Infini</em></strong>
      <span class="seed-label" id="seed-label">plateau #000000</span>
    </div>
  </div>
  <div class="stats" aria-live="polite">
    <div class="stat"><span class="stat-value" id="stat-tiles">0</span><span class="stat-label">tuiles</span></div>
    <div class="stat"><span class="stat-value" id="stat-moves">0</span><span class="stat-label">coups</span></div>
    <div class="stat"><span class="stat-value" id="stat-time">00:00</span><span class="stat-label">temps</span></div>
  </div>
  <div class="top-actions">
    <button id="btn-help" class="icon-btn" title="Comment jouer">?</button>
    <button id="btn-theme" class="icon-btn" title="Changer de thème">🎨</button>
    <button id="install-btn" class="icon-btn hidden" title="Installer l'application">📲</button>
  </div>
</header>

<main id="board-viewport" class="board-viewport">
  <div id="board-wrapper" class="board-wrapper">
    <div id="board" class="board" role="grid" aria-label="Plateau de mahjong"></div>
  </div>
  <div id="joker-hint" class="joker-hint hidden">Touchez 2 tuiles libres à faire disparaître</div>
</main>

<nav id="powers-bar" class="powers-bar">
  <button class="power-btn" id="power-hint" data-power="hint">
    <span class="power-icon">👁️</span>
    <span class="power-name">Indice</span>
    <span class="power-count" id="count-hint">3</span>
  </button>
  <button class="power-btn" id="power-shuffle" data-power="shuffle">
    <span class="power-icon">🌀</span>
    <span class="power-name">Mélange</span>
    <span class="power-count" id="count-shuffle">2</span>
  </button>
  <button class="power-btn" id="power-joker" data-power="joker">
    <span class="power-icon">⚡</span>
    <span class="power-name">Joker</span>
    <span class="power-count" id="count-joker">1</span>
  </button>
  <button class="power-btn" id="power-undo" data-power="undo">
    <span class="power-icon">⏪</span>
    <span class="power-name">Annuler</span>
    <span class="power-count" id="count-undo">3</span>
  </button>
  <span class="powers-sep"></span>
  <button class="power-btn action" id="btn-restart" title="Recommencer ce plateau">
    <span class="power-icon">🔁</span>
    <span class="power-name">Reset</span>
  </button>
  <button class="power-btn action primary" id="btn-newboard" title="Nouveau plateau">
    <span class="power-icon">✨</span>
    <span class="power-name">Nouveau</span>
  </button>
</nav>

<div id="toast" class="toast" aria-live="polite"></div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<template id="tpl-help">
  <h2>Comment jouer</h2>
  <p>Le plateau empile des tuiles sur plusieurs étages. Une tuile est <strong>libre</strong> si rien n'est posé au-dessus, et si sa gauche ou sa droite n'est pas bloquée.</p>
  <p>Touchez deux tuiles libres identiques pour les retirer. Videz le plateau pour gagner.</p>
  <h3>Pouvoirs</h3>
  <ul>
    <li><strong>👁️ Indice</strong> — révèle une paire jouable.</li>
    <li><strong>🌀 Mélange</strong> — redistribue les tuiles restantes si vous êtes bloqué.</li>
    <li><strong>⚡ Joker</strong> — supprime 2 tuiles libres de votre choix, même différentes.</li>
    <li><strong>⏪ Annuler</strong> — reprend le dernier coup.</li>
  </ul>
  <p><strong>🔁 Reset</strong> relance le plateau actuel à zéro. <strong>✨ Nouveau</strong> génère une disposition totalement différente — il en existe virtuellement l'infini.</p>
  <button class="btn-primary" id="help-close">Compris</button>
</template>

<template id="tpl-theme">
  <h2>Choisir un thème</h2>
  <div class="theme-grid">
    <button class="theme-card" data-theme="classic">
      <span class="theme-swatch classic-swatch"></span>
      Classique
    </button>
    <button class="theme-card" data-theme="cyberpunk">
      <span class="theme-swatch cyberpunk-swatch"></span>
      Neon City 2077
    </button>
  </div>
  <p class="theme-note">Thème « Neon City 2077 » : identité visuelle originale inspirée de l'esthétique cyberpunk (néons, glitch, netrunners) — aucun logo ni visuel protégé reproduit.</p>
</template>

<template id="tpl-win">
  <h2 class="win-title">Plateau vidé 🎉</h2>
  <p id="win-stats"></p>
  <div class="modal-actions">
    <button class="btn-secondary" id="win-restart">Rejouer ce plateau</button>
    <button class="btn-primary" id="win-newboard">Nouveau plateau</button>
  </div>
</template>

<template id="tpl-stuck">
  <h2 class="stuck-title">Plus aucun coup possible</h2>
  <p>Utilisez un pouvoir pour vous débloquer, ou repartez à zéro.</p>
  <div class="modal-actions">
    <button class="btn-secondary" id="stuck-shuffle">🌀 Mélanger</button>
    <button class="btn-secondary" id="stuck-restart">🔁 Recommencer</button>
    <button class="btn-primary" id="stuck-newboard">✨ Nouveau plateau</button>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
